name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      before-setup-ruby: |
        # Gemfile.lock is untracked, so generate one before setup-ruby
        # computes its bundle cache key — otherwise the key is constant
        # and stale vendor/bundle caches are restored across dependency
        # changes. The generated lock stays untracked (see .gitignore).
        bundle lock
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          sudo apt-get update && sudo apt-get install -y libreoffice
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          brew install --cask libreoffice
        fi
    secrets:
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
